# --- Spending-intel sources: Socrata state checkbooks ----------------------
# Not pilot college states - these are state open-data checkbooks with a real
# Socrata API, queried server-side for watchlist vendor/competitor names
# (case-insensitive, so ALL-CAPS vendor names still hit). No university_systems,
# so only the transparency pass runs. Great for "which states already pay
# Ellucian / EAB / Workday / etc." market intel.
# Socrata payments datasets with column mappings feed `--ingest-spend` (SODA ->
# normalized `payments` table). higher_ed_in_scope means colleges appear as
# paying departments, so competitor payments show up (displacement signal).
connecticut:
  university_systems: []
  transparency:
    - name: "State of Connecticut Open Expenditures - Ledger (current)"
      url: "https://data.ct.gov/d/ajdm-rvz7"
      type: socrata
      domain: data.ct.gov
      dataset: ajdm-rvz7            # replaces deprecated jz5u-r6jf
      vendor_col: vendor
      amount_col: amount
      date_col: payment_date
      agency_col: department
      higher_ed_in_scope: true
      notes: "Verified: Ellucian via CSU-Western. Freshest of the set (payments within ~2 weeks)."

delaware:
  university_systems: []
  transparency:
    - name: "State of Delaware Checkbook"
      url: "https://data.delaware.gov/d/5s6n-7hpx"
      type: socrata
      domain: data.delaware.gov
      dataset: 5s6n-7hpx            # replaces archived cbcj-ys58
      vendor_col: vendor
      amount_col: amount
      date_col: check_date
      agency_col: department
      higher_ed_in_scope: true
      notes: "Verified: ELLUCIAN SUPPORT INC ($108k, dept HIGHER EDUCATION), EAB GLOBAL INC."

massachusetts:
  university_systems: []
  transparency:
    - name: "Massachusetts CTHRU Statewide Spending"
      url: "https://cthru.data.socrata.com/d/pegc-naaa"
      type: socrata
      domain: cthru.data.socrata.com
      dataset: pegc-naaa
      vendor_col: vendor
      amount_col: amount
      date_col: date
      agency_col: department
      higher_ed_in_scope: true
      notes: "Verified: Ellucian via Berkshire Community College. Refreshed ~Feb 2026 (staler than the rest)."

maryland:
  university_systems: []
  transparency:
    - name: "State of Maryland Payments Data"
      url: "https://opendata.maryland.gov/d/7syw-q4cy"
      type: socrata
      domain: opendata.maryland.gov
      dataset: 7syw-q4cy
      vendor_col: vendor_name
      amount_col: amount
      date_col: date
      agency_col: agency_name
      higher_ed_in_scope: true
      notes: "Verified: Ellucian + Anthology via Baltimore City Community College. vendor_name abbreviated. Spans 2008-2026."

new_york:
  university_systems: []
  transparency:
    - name: "New York State Authorities Procurement"
      url: "https://data.ny.gov/d/ehig-g5x3"
      type: socrata
      domain: data.ny.gov
      dataset: ehig-g5x3
      higher_ed_in_scope: false
      notes: "WEAK: public-authorities procurement only (no vendor_col mapped, so --ingest-spend skips it). Real NY statewide checkbook (OSC Open Book) is a ColdFusion form app with no API."


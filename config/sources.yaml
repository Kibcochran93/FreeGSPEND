# Pilot config: 10 states. Every URL below was fetched and verified during
# research (either directly in this project's chat session, or by a research
# agent that confirmed each page loads and matches its expected content type).
#
# type values, and what the scraper does with each:
#   html_table   - real server-rendered HTML table/list -> scraped directly
#                  with requests + BeautifulSoup.
#   html_list    - server-rendered list of links (not a <table>) -> scraped
#                  the same way as html_table, just less structured.
#   pdf_list     - a page that is itself mostly a big block of real text/PDF
#                  content (e.g. very large minutes docs) -> treated like
#                  html_list but expect slower parsing / bigger pages.
#   js_rendered  - confirmed to return an empty shell to a basic HTTP fetch
#                  (Jaggaer/SciQuest, GEP SMART, Oracle Fusion, Tableau, Ariba,
#                  AJAX search forms, etc). The scraper will SKIP these by
#                  default and log them as "needs_browser" in the report
#                  unless you wire in Playwright (see README).
#   form_post    - requires session cookies / anti-CSRF tokens to query.
#                  Skipped by default, logged as "needs_session".
#
# Add new states/institutions by copying a block and changing the URLs.

arkansas:
  university_systems:
    - name: "University of Arkansas System (Fayetteville / HogBid)"
      domain: "uark.edu"
      bid_boards:
        - url: "https://hogbid.uark.edu/"
          type: html_table
          notes: "UAF + UA System Office formal bids. Verified working."
      board_minutes:
        - url: "https://uasys.edu/leadership/board-of-trustees/meetings/"
          type: html_list
          notes: "Chronological, agenda + minutes PDF links back to 2021."
    - name: "University of Central Arkansas"
      domain: "uca.edu"
      bid_boards:
        - url: "https://uca.edu/procurement/current-bids/"
          type: html_table
          notes: "Verified working, includes ERP/RFP postings."
  transparency:
    - name: "Transparency.Arkansas.gov (statewide)"
      url: "https://transparency.arkansas.gov/"
      type: js_rendered
      notes: "Vendor/contract search is AJAX-driven; page shell only via basic fetch."
    - name: "UA System Open Checkbook"
      url: "https://uasys.edu/system-office/open-checkbook/"
      type: js_rendered
      notes: "Power BI embeds, not scrapable without a browser."
  federal_grants:
    - name: "USAspending federal student-success grants (AR)"
      type: usaspending
      state: AR
      notes: "Dept. of Ed Title III/V, TRIO, GEAR UP awards to AR colleges. Keyless API, nationwide."


# Keyword taxonomy used to classify bid postings and to keyword-search
# board minutes / transparency data. Edit freely - categories are just
# labels, matching is plain case-insensitive substring/regex matching
# (see govspend_free/utils.py: match_categories()).

categories:
  student_success_retention:
    label: "Student Success & Retention"
    keywords:
      - advising
      - "academic advising"
      - persistence
      - retention
      - wellness
      - "early alert"
      - "case management"
      - "predictive analytics"
      - engagement
      - intervention
      - "student success"
      - "student success platform"

  academic_space_scheduling:
    label: "Academic & Space Scheduling"
    keywords:
      - scheduling
      - timetabling
      - "course scheduling"
      - "room scheduling"
      - "campus scheduling"
      - "classroom utilization"
      - "space optimization"
      - "space management"

  attendance_compliance:
    label: "Attendance & Compliance"
    keywords:
      - "attendance tracking"
      - "attendance verification"
      - "attendance management"
      - "title iv"
      - "compliance reporting"
      - "engagement monitoring"
      - "last date of attendance"
      - "roster verification"
      - "sevis compliance"
      - sevis

  ai_chatbot_messaging:
    label: "AI Chatbot & Messaging"
    keywords:
      - chatbot
      - "conversational ai"
      - "student messaging"
      - "text messaging"
      - sms
      - "virtual assistant"
      - "student communications"

  sis_erp_migration:
    label: "SIS / ERP Migration"
    keywords:
      - "sis migration"
      - "erp modernization"
      - "erp assessment"
      - "enterprise resource planning"
      - "student information system"
      - "curriculum management"
      - banner
      - "workday student"
      - colleague
      - jenzabar
      - peoplesoft
      - ellucian

  # --- Deal-trigger signals from the SEAtS GTM playbook ---------------------
  # These are the "problems that create a deal" - accreditation timing and
  # compliance/reporting pain - not product categories. A board-minutes doc
  # hitting these plus a product category above is a high-fit account.
  accreditation_effectiveness:
    label: "Accreditation & Institutional Effectiveness"
    keywords:
      - accreditation
      - reaffirmation
      - "self-study"
      - "self study"
      - "site visit"
      - "institutional effectiveness"
      - "program review"
      - "assurance argument"
      - SACSCOC
      - NWCCU
      - WSCUC
      - "middle states"

  institutional_research_reporting:
    label: "Institutional Research & Mandatory Reporting"
    keywords:
      - IPEDS
      - "institutional research"
      - "state reporting"
      - "federal reporting"
      - "mandatory reporting"
      - "data governance"
      - "return of title iv"
      - "financial aid audit"

# Free-text vendor / product watchlist. These terms are searched for
# specifically in board meeting minutes text and (where scrapable)
# transparency/vendor payment data, separate from the bid categories above.
#
# NOTE: watchlist matching is CASE-SENSITIVE and word-boundaried (unlike the
# categories above), so "SEAtS" matches the brand but not the word "seats".
# Use the real casing of each name. All-caps mentions won't match unless you
# add that casing explicitly.
watchlist:
  # Your products
  - "SEAtS"
  - "SEAtS Software"
  - "SEAtS ONE"

  # Student-success / retention competitors
  - "Civitas"
  - "Civitas Learning"
  - "Starfish"
  - "EAB"
  - "Watermark"
  - "Engage2Serve"
  - "Anthology"

  # Scheduling / space competitors
  - "Coursedog"
  - "Ready Education"
  - "Unit4"

  # SIS / ERP incumbents (mentions can signal a migration window)
  - "Ellucian"
  - "Jenzabar"
  - "Workday Student"
  - "PeopleSoft"
